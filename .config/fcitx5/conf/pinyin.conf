# Shuangpin Profile
ShuangpinProfile=Xiaohe
# Show current shuangpin mode
ShowShuangpinMode=True
# Candidates Per Page
PageSize=9
# Show English Candidates
SpellEnabled=False
# Show symbol candidates
SymbolsEnabled=False
# Show Chaizi candidates
ChaiziEnabled=False
# Enable more Characters after Unicode CJK Extension B
ExtBEnabled=False
# Show stroke candidates when typing with h(一), s(丨), p(丿), n(㇏), z(𠃍)
StrokeCandidateEnabled=False
# Enable Cloud Pinyin
CloudPinyinEnabled=True
# Cloud Pinyin Candidate Order
CloudPinyinIndex=2
# Show animation when Cloud Pinyin is loading
CloudPinyinAnimation=False
# Always show Cloud Pinyin place holder
KeepCloudPinyinPlaceHolder=False
# Preedit Mode
PreeditMode="Do not show"
# Fix embedded preedit cursor at the beginning of the preedit
PreeditCursorPositionAtBeginning=True
# Show complete pinyin in preedit
PinyinInPreedit=False
# Enable Prediction
Prediction=False
# Keep the current typed text for next input prediction
KeepCurrentContext=True
# Number of Predictions
PredictionSize=64
# Backspace behavior on prediction
BackspaceBehaviorOnPrediction="Clear candidates & backspace"
# Action when switching input method
SwitchInputMethodBehavior="Commit current preedit"
# Select Second Candidate
SecondCandidate=
# Select Third Candidate
ThirdCandidate=
# Use Keypad as Selection key
UseKeypadAsSelection=False
# Use BackSpace to cancel the selection
BackSpaceToUnselect=True
# Number of Sentences
Number of sentence=2
# Number of Phrase Candidates
WordCandidateLimit=8
# Prompt long word length when input length over (0 for disable)
LongWordLengthLimit=4
# Key to trigger quickphrase
QuickPhraseKey=Control+apostrophe
# Use V to trigger quickphrase
VAsQuickphrase=False
# Regular expression to trigger quick phrase
QuickPhraseTriggerRegex=
# FirstRun
FirstRun=False

[ForgetWord]
0=Control+7

[PrevPage]
0=Page_Up

[NextPage]
0=Next

[PrevCandidate]
0=Shift+Tab

[NextCandidate]
0=Tab

[CurrentCandidate]
0=space
1=KP_Space

[CommitRawInput]
0=Return
1=KP_Enter
2=Control+Return
3=Control+KP_Enter
4=Shift+Return
5=Shift+KP_Enter
6=Control+Shift+Return
7=Control+Shift+KP_Enter

[ChooseCharFromPhrase]
0=bracketleft
1=bracketright

[FilterByStroke]
0=grave

[Fuzzy]
# ue -> ve
VE_UE=False
# Common Typo
NG_GN=False
# Inner Segment (xian -> xi'an)
Inner=False
# Inner Segment for Short Pinyin (qie -> qi'e)
InnerShort=False
# Match partial finals (e -> en, eng, ei)
PartialFinal=False
# Match partial shuangpin if input length is longer than 4
PartialSp=False
# u <-> v
V_U=False
# an <-> ang
AN_ANG=False
# en <-> eng
EN_ENG=False
# ian <-> iang
IAN_IANG=False
# in <-> ing
IN_ING=False
# u <-> ou
U_OU=False
# uan <-> uang
UAN_UANG=False
# c <-> ch
C_CH=False
# f <-> h
F_H=False
# l <-> n
L_N=False
# l <-> r
L_R=False
# s <-> sh
S_SH=False
# z <-> zh
Z_ZH=False
# Correction Layout
Correction=None

