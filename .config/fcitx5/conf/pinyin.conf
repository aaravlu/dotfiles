# Shuangpin Profile
ShuangpinProfile=Xiaohe
# Show current shuangpin mode
ShowShuangpinMode=True
# Page size
PageSize=9
# Enable Spell
SpellEnabled=False
# Enable Symbols
SymbolsEnabled=False
# Enable Chaizi
ChaiziEnabled=False
# Enable Characters in Unicode CJK Extension B
ExtBEnabled=False
# Enable Cloud Pinyin
CloudPinyinEnabled=True
# Cloud Pinyin Index
CloudPinyinIndex=2
# Show animation when Cloud Pinyin is loading
CloudPinyinAnimation=True
# Always show Cloud Pinyin place holder
KeepCloudPinyinPlaceHolder=False
# Preedit Mode
PreeditMode="Do not show"
# Fix embedded preedit cursor at the beginning of the preedit
PreeditCursorPositionAtBeginning=True
# Show complete pinyin in preedit
PinyinInPreedit=False
# Enable Prediction
Prediction=False
# Prediction Size
PredictionSize=10
# Action when switching input method
SwitchInputMethodBehavior="Commit default selection"
# Select 2nd Candidate
SecondCandidate=
# Select 3rd Candidate
ThirdCandidate=
# Use Keypad as Selection key
UseKeypadAsSelection=False
# Use BackSpace to cancel the selection
BackSpaceToUnselect=True
# Number of Sentences
Number of sentence=1
# Prompt long word length when input length over (0 for disable)
LongWordLengthLimit=0
# Key to trigger quickphrase
QuickPhraseKey=semicolon
# Use V to trigger quickphrase
VAsQuickphrase=False
# Regular expression to trigger quick phrase
QuickPhraseTriggerRegex=
# FirstRun
FirstRun=False

[ForgetWord]
0=Control+7

[PrevPage]
0=Page_Up

[NextPage]
0=Next

[PrevCandidate]
0=Up
1=Left

[NextCandidate]
0=Down
1=Right

[CurrentCandidate]
0=space
1=KP_Space

[CommitRawInput]
0=Return
1=KP_Enter
2=Control+Return
3=Control+KP_Enter
4=Shift+Return
5=Shift+KP_Enter
6=Control+Shift+Return
7=Control+Shift+KP_Enter

[ChooseCharFromPhrase]
0=bracketleft
1=bracketright

[FilterByStroke]
0=grave

[Fuzzy]
# ue -> ve
VE_UE=False
# Common Typo
NG_GN=False
# Inner Segment (xian -> xi'an)
Inner=False
# Inner Segment for Short Pinyin (qie -> qi'e)
InnerShort=False
# Match partial finals (e -> en, eng, ei)
PartialFinal=False
# Match partial shuangpin if input length is longer than 4
PartialSp=False
# u <-> v
V_U=False
# an <-> ang
AN_ANG=False
# en <-> eng
EN_ENG=False
# ian <-> iang
IAN_IANG=False
# in <-> ing
IN_ING=False
# u <-> ou
U_OU=False
# uan <-> uang
UAN_UANG=False
# c <-> ch
C_CH=False
# f <-> h
F_H=False
# l <-> n
L_N=False
# s <-> sh
S_SH=False
# z <-> zh
Z_ZH=False
# Correction Layout
Correction=None

